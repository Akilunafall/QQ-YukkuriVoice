name: Build macOS and Linux packages

on:
  workflow_dispatch:
  push:
    paths:
      - src/Yukkuri.CrossPlatform/**
      - src/Yukkuri.Desktop/Assets/pinyin-kana.tsv
      - src/Yukkuri.Desktop/Assets/voices/**
      - src/Yukkuri.Desktop/Assets/qq-bridge/**
      - docs/跨平台版本.md
      - THIRD-PARTY-NOTICES.md
      - .github/workflows/cross-platform-packages.yml

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: x64
            runner: macos-15-intel
          - platform: darwin
            arch: arm64
            runner: macos-15
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: src/Yukkuri.CrossPlatform
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Yukkuri.CrossPlatform/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Test offline speech and unchanged voice libraries
        run: npm test
      - name: Build platform packages
        run: node scripts/package.cjs "${{ matrix.platform }}" "${{ matrix.arch }}"
      - name: Verify macOS archive signature and launch
        if: matrix.platform == 'darwin'
        run: |
          mkdir -p ../../.test-data/mac-packaged
          ditto -x -k "../../dist/YukkuriVoice-1.3.0-CrossPlatform/YukkuriVoice-1.3.0-mac-${{ matrix.arch }}.zip" ../../.test-data/mac-packaged
          codesign --verify --deep --strict ../../.test-data/mac-packaged/YukkuriVoice.app
          export YUKKURI_PACKAGED_EXECUTABLE="$PWD/../../.test-data/mac-packaged/YukkuriVoice.app/Contents/MacOS/Electron"
          node scripts/check-ui.cjs
      - name: Verify Linux installer metadata and launch
        if: matrix.platform == 'linux'
        run: |
          dpkg-deb --info "../../dist/YukkuriVoice-1.3.0-CrossPlatform/YukkuriVoice-1.3.0-linux-${{ matrix.arch }}.deb"
          mkdir -p ../../.test-data/linux-packaged
          tar -xzf "../../dist/YukkuriVoice-1.3.0-CrossPlatform/YukkuriVoice-1.3.0-linux-${{ matrix.arch }}.tar.gz" -C ../../.test-data/linux-packaged
          sudo chown root:root ../../.test-data/linux-packaged/YukkuriVoice/chrome-sandbox
          sudo chmod 4755 ../../.test-data/linux-packaged/YukkuriVoice/chrome-sandbox
          export YUKKURI_PACKAGED_EXECUTABLE="$PWD/../../.test-data/linux-packaged/YukkuriVoice/yukkuri-voice"
          xvfb-run -a node scripts/check-ui.cjs
      - name: Mark target system verification
        run: |
          node -e 'const fs=require("node:fs");const p="../../dist/YukkuriVoice-1.3.0-CrossPlatform/YukkuriVoice-1.3.0-"+(process.platform==="darwin"?"mac":"linux")+"-"+process.arch+".json";const records=JSON.parse(fs.readFileSync(p));for(const r of records)r.targetRuntimeTested=true;fs.writeFileSync(p,JSON.stringify(records,null,2));'
      - uses: actions/upload-artifact@v4
        with:
          name: YukkuriVoice-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/YukkuriVoice-1.3.0-CrossPlatform/*
          compression-level: 0
          retention-days: 14
